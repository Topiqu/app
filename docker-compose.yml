services:
  postgres:
    image: postgres:16-alpine
    container_name: rasg-blog-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rasg-blog
    ports:
      - "${PG_HOST_PORT:-5432}:5432"
    volumes:
      - rasg-blog-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rasg-blog"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8.1-alpine
    container_name: rasg-blog-cache
    restart: unless-stopped
    # Cache-only: no persistence, and volatile-lru so the TTL-less gen:* counters
    # are never the thing evicted (only keys carrying a TTL are candidates).
    command: ["valkey-server", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru", "--save", ""]
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rasg-blog-db:
