services:
  postgres:
    # Same major version and Debian base as production; pgvector ships in the image.
    image: pgvector/pgvector:pg18-trixie
    container_name: rasg-blog-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rasg-blog
    ports:
      - '${PG_HOST_PORT:-5432}:5432'
    volumes:
      # PG 18 images keep PGDATA under a versioned subdirectory, so the volume mounts one level up.
      - rasg-blog-db-18:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d rasg-blog']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rasg-blog-db-18:
