name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Mock secrets are shared by all jobs because `bun install` runs `postinstall`
# (`nuxt prepare`), which throws on missing keys during module init.
env:
  # Mock DB port, because quality doesn't use the DB
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rasg_test?schema=public
  NUXT_TELEMETRY_DISABLED: '1'
  NODE_ENV: test
  AUTH_SECRET: ci-mock-auth-secret-not-for-production
  AUTH_ORIGIN: http://localhost:3000
  STRIPE_PK: pk_test_ci_mock
  STRIPE_SK: sk_test_ci_mock
  STRIPE_WEBHOOK_SECRET: whsec_ci_mock
  XAI_API_KEY: ci-mock
  OPENAI_API_KEY: ci-mock
  CDN_URL: https://cdn.topiqu.com
  EMAIL_FROM: ci@example.com
  NUXT_MAIL_USER: ci@example.com
  AWS_ACCESS_KEY_ID: ci-mock
  AWS_SECRET_ACCESS_KEY: ci-mock
  AWS_REGION: eu-central-1
  AWS_S3_BUCKET_NAME: ci-mock-bucket

jobs:
  quality:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461 # v2.1.3
        with:
          bun-version: 1.4.3

      - name: Cache Nuxt build artifacts
        uses: actions/cache@v4
        with:
          path: |
            .nuxt
            node_modules/.cache
          key: nuxt-${{ runner.os }}-${{ hashFiles('package.json', 'bun.lock', 'nuxt.config.ts') }}
          restore-keys: |
            nuxt-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Needed for typecheck
      - name: Generate ZenStack client
        run: bun run zenstack:generate

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bun run prettier

      - name: Check OpenAPI contract
        run: bun run openapi:check

      - name: Typecheck
        run: bun run typecheck
        # vue-tsc outgrew Node's default heap on the runner (OOM since 2026-10-09).
        env:
          NODE_OPTIONS: --max-old-space-size=6144

  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rasg_unused?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rasg_test?schema=public

    services:
      postgres:
        image: pgvector/pgvector:pg18-trixie
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rasg_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461 # v2.1.3
        with:
          bun-version: 1.4.3

      - name: Cache Nuxt build artifacts
        uses: actions/cache@v4
        with:
          path: |
            .nuxt
            node_modules/.cache
          key: nuxt-${{ runner.os }}-${{ hashFiles('package.json', 'bun.lock', 'nuxt.config.ts') }}
          restore-keys: |
            nuxt-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate ZenStack client
        run: bun run zenstack:generate

      - name: Apply database migrations
        run: bun run db:migrate:deploy
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          DIRECT_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Test
        run: bun run test

  release-smoke:
    name: Production release smoke
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg18-trixie
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rasg_release_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: production
      PLAYWRIGHT_USE_BUILD: '1'
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rasg_release_test?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461 # v2.1.3
        with:
          bun-version: 1.4.3

      - name: Verify frozen dependency graph
        run: bun --bun install --shamefully-hoist --frozen-lockfile

      - name: Generate ZenStack client
        run: bun run zenstack:generate

      - name: Apply database migrations
        run: bun run db:migrate:deploy
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          DIRECT_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Build production output
        run: bun run build:docker
        # `nuxt build` runs on Node here (the image builds on Bun) and sits near the default heap.
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Check production performance budgets
        run: bun run perf:check

      - name: Install browser engines
        run: bunx playwright install --with-deps chromium webkit

      - name: Build deployment image without database credentials
        run: docker build --tag topiqu-ci:${{ github.sha }} .

      - name: Check deployment image performance budgets without runtime credentials
        run: |
          docker run --rm --network none --entrypoint /bin/sh \
            --mount "type=bind,src=$GITHUB_WORKSPACE/scripts/performance-budgets.ts,dst=/verify/scripts/performance-budgets.ts,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/performance-budgets.json,dst=/verify/performance-budgets.json,readonly" \
            topiqu-ci:${{ github.sha }} -c \
            'mkdir /tmp/topiqu-budget-check && ln -s /usr/src/app /tmp/topiqu-budget-check/.output && exec bun /verify/scripts/performance-budgets.ts /tmp/topiqu-budget-check'

      - name: Verify deployment migrations and Bun runtime
        shell: bash
        run: |
          set -euo pipefail
          container="topiqu-runtime-${{ github.run_id }}-${{ github.run_attempt }}"
          trap 'docker rm --force "$container" >/dev/null 2>&1 || true' EXIT
          docker exec '${{ job.services.postgres.id }}' createdb -U postgres rasg_image_test
          docker run --detach --name "$container" --network host \
            --env DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/rasg_image_test \
            --env AUTH_SECRET --env APP_ENV=test --env PGPOOL_MAX=2 \
            --env HOST=127.0.0.1 --env PORT=4183 \
            topiqu-ci:${{ github.sha }}
          test "$(docker exec "$container" id -u)" != 0
          test "$(docker exec "$container" bun --version)" = 1.4.3
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:4183/api/health; then
              ready=true
              break
            fi
            if test "$(docker inspect --format '{{.State.Running}}' "$container")" != true; then
              echo 'Deployment container exited before readiness.'
              exit 1
            fi
            sleep 1
          done
          test "$ready" = true
          curl --fail --silent --output /dev/null http://127.0.0.1:4183/api/live

      - name: Test production assets and service worker
        run: bun run test:e2e:release

      - name: Test wallet pagination and scrolling
        run: bun run test:e2e token-wallet.spec.ts --project=desktop-light-en --project=mobile-light-en

      - name: Test recovery, session controls and operator status
        run: bun run test:e2e production-workflows.spec.ts --project=desktop-light-en --project=desktop-dark-cs --workers=1
