name: Bug report
description: Report a reproducible problem without credentials or customer data.
body:
  - type: markdown
    attributes:
      value: For security issues, use the private reporting process in SECURITY.md.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Use synthetic data. Include a minimal example when possible.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, operating system, viewport and relevant runtime versions.
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Remove tokens, cookies, personal data and private URLs before sharing.
