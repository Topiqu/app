name: Feature request
description: Describe a user problem and the smallest useful improvement.
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Who is affected, and what are they trying to achieve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and constraints
